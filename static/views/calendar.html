      if (failedCount)     chips.push(`<span class="cf-chip cf-failed">✗ ${failedCount}</span>`);
      if (earlyAccessTotal > 0) {
        chips.push(`<span class="cf-chip cf-instant" data-tip="Of the deposits today, <strong>$${earlyAccessTotal.toFixed(2)}</strong> was granted immediate buying power (the rest waits 3-5 days for ACH clearing). Tilt-relevant amount for same-day intervention analysis.">⚡ $${earlyAccessTotal.toFixed(0)} instant</span>`);
      }

      // Sort rows: pending+completed first by submission time, failed/voided last
      const order = (e) => ['failed', 'voided'].includes(e.state) ? 2 : 0;
      const sorted = [...events].sort((a, b) => order(a) - order(b)
                                                || (a.timestamp || '').localeCompare(b.timestamp || ''));

      const iconFor = (kind) =>
        kind === 'deposit'    ? '↓' :
        kind === 'withdrawal' ? '↑' :
        kind === 'internal'   ? '↔' :
        kind === 'gold_fee'   ? '💳' :
        kind === 'dividend'   ? '💰' :
        kind === 'referral'   ? '🎁' : '·';
      const amountCls = (e) => {
        if (e.kind === 'deposit' || e.kind === 'dividend' || e.kind === 'referral') return 'pos';
        if (e.kind === 'withdrawal' || e.kind === 'gold_fee') return 'neg';
        return 'neutral';
      };
      const signFor = (e) =>
        e.kind === 'deposit' || e.kind === 'dividend' || e.kind === 'referral' ? '+' :
        e.kind === 'withdrawal' || e.kind === 'gold_fee' ? '−' : '';
      // Compact time formatter: HH:MM for events with an ISO timestamp (transfers),
      // M/D fallback for date-only events (dividends, gold fees, referrals).
      // Lets the 60px time column accommodate both without wrapping.
      const tsCompact = (e) => {
        if (e.timestamp) {
          const m = String(e.timestamp).match(/T(\d{2}:\d{2})/);
          if (m) return m[1];
        }
        if (e.date) {
          const parts = e.date.split('-');
          if (parts.length === 3) return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
          return e.date;
        }
        return '';
      };
      // Derive a readable "from/to/asset" for the note column. Order of preference:
      //   internal/deposit/withdrawal → human account names
      //   dividend                    → resolved ticker symbol, fall back to UUID prefix
      //   else                        → originator, note, asset, transfer_type
      const noteFor = (e) => {
        if (e.kind === 'internal' && (e.orig_account_name || e.recv_account_name)) {
          return `${e.orig_account_name || '?'} → ${e.recv_account_name || '?'}`;
        }
        if (e.kind === 'deposit'    && e.recv_account_name) return `→ ${e.recv_account_name}`;
        if (e.kind === 'withdrawal' && e.orig_account_name) return `${e.orig_account_name} →`;
        if (e.kind === 'dividend') {
          if (e.symbol) return e.symbol;
          if (e.instrument_id) return e.instrument_id.slice(0, 8) + '…';
          return '';
        }
        return e.originator || e.note || e.asset || e.transfer_type || '';
      };
      // Tooltip — full instrument UUID is useful for dividends when only a prefix renders.
      const titleFor = (e) => {
        if (e.kind === 'dividend' && e.instrument_id) {
          return `instrument: ${e.instrument_id}` + (e.symbol ? ` (${e.symbol})` : '');
        }
        return noteFor(e) || '';
      };

      const rowsHTML = sorted.map(e => {
        const dim = ['failed', 'voided'].includes(e.state) ? ' dim' : '';
        const stateCls = ['failed', 'voided', 'pending'].includes(e.state) ? e.state : '';
        const time = tsCompact(e);
        const instantBadge = (e.kind === 'deposit' && e.early_access_amount > 0)
          ? ` <span class="cf-row-instant" data-tip="$${e.early_access_amount.toFixed(2)} of this deposit became immediately tradeable (early-access granted by RH)">⚡</span>` : '';
        return `<div class="cf-row${dim}">
          <span class="cf-ico">${iconFor(e.kind)}</span>
          <span class="cf-kind">${e.kind.replace('_', ' ')}</span>
          <span class="cf-date">${time}</span>
          <span class="cf-note" title="${(titleFor(e) || '').replace(/"/g, '&quot;')}">${noteFor(e)}${instantBadge}</span>
          <span class="cf-amount ${amountCls(e)}">${signFor(e)}$${Math.abs(e.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
          <span class="cf-state ${stateCls}">${e.state}</span>
        </div>`;
      }).join('');

      const cfOpenAttr = readPref('cal-cf-open', false) ? 'open' : '';
      return `<details class="cf-section" id="cf-section" ${cfOpenAttr}>
        <summary class="cf-summary">
          <span class="cf-caret">▶</span>
          <span class="cf-summary-label">Cash flow</span>
          <span class="cf-summary-amount">${summary}</span>
          <span class="cf-summary-chips">${chips.join(' ')}</span>
          <span class="cf-summary-count">${events.length} event${events.length > 1 ? 's' : ''}</span>
          <span class="cf-info" data-tip="<strong>Cash flow</strong> — every transfer, fee, dividend, and referral grant dated to this day. Internals (↔) move money between your own accounts and don't change your net deposited basis. Failed/voided rows are shown greyed out.">ⓘ</span>
        </summary>
        <div class="cf-body">
          <div class="cf-thead">
            <span></span><span>Kind</span><span>Time</span><span>From / To · Note</span>
            <span style="text-align:right">Δ Balance</span><span style="text-align:right">State</span>
          </div>
          ${rowsHTML}
        </div>
      </details>`;
    }

    // Render carried-into-next-session section for trades opened today but closing later.
    // Shown on the entry date so the user still sees what they put on, even though P/L
    // attribution lives on the exit date (Option II accounting).
    // Renders "Carried positions" — trades opened on this date that close on a different
    // date (covers anything from overnight 1DTE up to multi-month holds). Each row is
    // clickable and links to the right destination:
    //   • If position is still open (no spy_trades.csv close yet) → Positions tab with
    //     scroll-to-highlight via #positions:<contract_key>
    //   • Already closed (multi-day historical) → calendar modal for the close date
    function renderCarriedOut() {
      if (!carriedOutTrades.length) return '';
      const groups = new Map();
      carriedOutTrades.forEach(t => {
        const g = groupKey(t);
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(t);
      });
      const items = [...groups.values()].map(rows => {
        const first = rows[0];
        const totalQty = rows.reduce((s, r) => s + (r.qty || 0), 0);
        const totalEntryCost = rows.reduce((s, r) => s + Math.abs(r.entry_cost || 0), 0);
        const entryPx = totalQty ? totalEntryCost / (totalQty * 100) : 0;
        const closeDate = first.exit_date;
        // Build contract_key matching the Positions view format: SYMBOL-STRIKE-TYPE-EXPIRY
        // We don't have expiry in spy_trades.csv per row reliably (could parse from group_id),
        // so use a lighter key keyed on symbol/strike/type/close-date for the link target.
        const contractKey = `${(first.symbol||'SPY')}-${first.strike}-${first.type}-${first.expiry_date || closeDate}`;
        const days = (() => {
          try { return Math.max(1, Math.round((new Date(closeDate) - new Date(first.date)) / 86400000)); } catch { return null; }
        })();
        const heldLabel = days == null ? '' : (days === 1 ? '1 day held' : `${days} days held`);
        return `<div class="carried-row" role="button" tabindex="0"
            data-contract-key="${contractKey}" data-close-date="${closeDate}"
            data-tip="<strong>Click to navigate</strong><br>If still open: jumps to Positions tab with this contract highlighted.<br>If already closed: opens the modal for the close date (${fmtShortDate(closeDate)}).">
          <span class="ct-contract">${(first.symbol||'SPY')} ${first.strike}${typeAbbr(first.type)}</span>
          <span class="ct-qty">×${totalQty}</span>
          <span class="ct-entry">${fmtTime(first.entry_time)} @ ${fmtPrice(entryPx)}</span>
          <span class="ct-closes">closes ${fmtShortDate(closeDate)}${heldLabel ? ' · ' + heldLabel : ''}</span>
          <span class="pending-tag">PENDING</span>
        </div>`;
      }).join('');
      return `<div class="carried-section">
        <h4 data-tip="<strong>Carried positions</strong> — opened on this day, closed on a different day. Could be overnight (1DTE) up to long-dated holds. Realized P/L is attributed to the close date, not today.">Carried positions</h4>
        <p class="carried-note">Realized P/L attributed to close date — not counted in today's total. Click any row to follow.</p>
        ${items}
      </div>`;
    }

    function renderForMode(mode) {
      switch (mode) {
        case 'legs':       return renderLegsView();
        case 'roundtrips': return renderRoundtripsView();
        case 'fills':      return renderFillsView();
        case 'contract':   return renderContractView();
        case 'hour':       return renderHourView();
        default:           return renderLegsView();
      }
    }

    function chipsHTML(active) {
      return VIEW_MODES.map(m =>
        `<button class="cal-mode-chip ${m.id === active ? 'active' : ''}" data-mode="${m.id}">${m.label}</button>`
      ).join('');
    }

    function paint() {
      const mode = getViewMode();
      const validMode = VIEW_MODES.some(m => m.id === mode) ? mode : VIEW_DEFAULT;
      const heading = validMode === 'legs' ? 'Legs'
                    : validMode === 'roundtrips' ? 'Round trips'
                    : validMode === 'fills' ? 'Fills (raw executions)'
                    : validMode === 'contract' ? 'By contract'
                    : 'By hour';
      modalEl.innerHTML = `
        <button class="cal-close" aria-label="Close">×</button>
        <h2>${dateStr} — ${dowName}</h2>
        <div class="cal-sub">${dayData ? dayData.num_trades + ' trades · ' + totalQty + ' contracts' : 'No data'}</div>
        <div class="cal-stat-row">
          <div><span class="lbl">Day P/L</span><span class="val ${plClass}">${dayData ? fmtPL(dayData.pl) : '—'}</span></div>
          <div><span class="lbl">Wins</span><span class="val">${dayData ? dayData.wins + '/' + dayData.num_trades : '—'}${wrBadge}</span></div>
          <div><span class="lbl">Cumulative</span><span class="val">${dayData ? fmtPL(dayData.cumulative_pl) : '—'}</span></div>
          <div><span class="lbl">VIX</span><span class="val">${dayData && dayData.vix != null ? dayData.vix : '—'}</span></div>
        </div>
        <div class="cal-meta-row">
          <span data-tip="<strong>Friction est.</strong> — estimated bid-ask spread cost across all round trips today.
Formula: ~$${FRICTION_PER_CONTRACT_RT}/contract round trip × ${totalQty} contracts.
Assumes ~$0.03 spread on 0DTE SPY ATM options, paid on entry + exit.
Real spread isn't in your CSVs (RH doesn't report execution-time bid/ask), so this is a flat estimate."><span class="meta-label">Friction est.</span><span class="friction-est">~$${friction.toLocaleString()} cost</span></span>
          <span data-tip="<strong>Fees</strong> — Robinhood options contract fees (ORF + clearing).
Formula: $${FEE_PER_CONTRACT_SIDE}/contract/side × ${totalQty} contracts × 2 sides = $${fees}.
Exact — deterministic from contract count, not estimated."><span class="meta-label">Fees</span><span class="friction-est">$${fees.toFixed(2)}</span></span>
          <span data-tip="<strong>Adds</strong> — events where you increased an existing position (didn't go flat first).
🔻 avg-down: added at a lower price than your existing basis (doubling down on a losing thesis)
🔺 avg-up:   added at a higher price (scaling into a working thesis)
➕ flat:     added at the same price (rare; broker-fragmented opens within 60s are auto-merged and don't count here)"><span class="meta-label">Adds:</span>
            <span class="add-down">${totalAddsDown}🔻</span>
            <span class="add-up">${totalAddsUp}🔺</span>
            ${totalAddsFlat ? `<span class="add-flat">${totalAddsFlat}➕</span>` : ''}
          </span>
          <span data-tip="<strong>Legs</strong> — a continuous holding period for one (strike, type) pair.
Starts when you open a new position, ends the moment your net contracts on that strike returns to zero.
Re-entering the same strike later = a new leg (a separate trading decision).
Multiple round trips of the same strike inside one continuous hold = one leg with multiple exits."><span class="meta-label">Legs:</span>${legs.length}</span>
          ${anomalies ? `<span class="anomaly" data-tip="<strong>Anomaly rows</strong> — rows with qty=0 (likely options events: expirations, exercises, or assignments). Skipped from leg detection.">⚠ ${anomalies} anomaly row${anomalies > 1 ? 's' : ''}</span>` : ''}
        </div>
        ${renderCarriedOut()}
        ${renderIntradayChartSection()}
        ${renderCashFlowSection()}
        <div class="cal-mode-row">
          <span class="lbl">View</span>
          ${chipsHTML(validMode)}
        </div>
        <h3>${heading}</h3>
        <div id="cal-view-body">${renderForMode(validMode)}</div>
      `;
      modalEl.querySelector('.cal-close').addEventListener('click', closeModal);
      modalEl.querySelectorAll('.cal-mode-chip').forEach(btn => {
        btn.addEventListener('click', () => { setViewMode(btn.dataset.mode); paint(); });
      });
      // Leg row expand/collapse
      modalEl.querySelectorAll('.leg-row').forEach(row => {
        row.addEventListener('click', (e) => {
          // ignore clicks on inner events
          if (e.target.closest('.leg-events')) return;
          row.classList.toggle('expanded');
        });
      });
      // Carried-positions row click → cross-view navigation
      modalEl.querySelectorAll('.carried-row[role="button"]').forEach(row => {
        const handler = async () => {
          const ckey = row.dataset.contractKey;
          const closeDate = row.dataset.closeDate;
          // Check if position is still open: hit /api/positions and look for matching key
          let stillOpen = false;
          try {
            const positions = await apiFetch('/api/positions');
            stillOpen = positions.some(p => p.contract_key === ckey);
          } catch {}
          closeModal();
          if (stillOpen && typeof window.loadView === 'function') {
            window.location.hash = 'positions:' + encodeURIComponent(ckey);
            window.loadView('positions');
          } else {
            // Position already closed — jump to its close-date modal
            // (calendar view is already loaded, just open the modal for that date)
            if (lookup[closeDate]) openDayModal(closeDate);
            else if (typeof window.loadView === 'function') window.loadView('calendar');
          }
        };
        row.addEventListener('click', handler);
        row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
      });
      // Custom tooltip bindings (replaces native title=)
      bindTips(modalEl);
    }

    // Intraday chart lifecycle. Fetch once per modal open (cached in intradayCache).
    // Mount the chart after every paint, since paint rewrites innerHTML and destroys
    // the chart's container. activeChart is module-level so closeModal() cleans up
    // regardless of which paint installed the chart.
    let intradayInterval = 5;
    async function getIntradayData() {
      if (intradayCache.has(dateStr)) return intradayCache.get(dateStr);
      const promise = apiFetch('/api/spy/intraday/' + dateStr).catch(() => null);
      intradayCache.set(dateStr, promise);
      const resolved = await promise;
      intradayCache.set(dateStr, resolved);
      return resolved;
    }
    async function mountIntradayChart() {
      const mount = modalEl.querySelector('#ic-mount');
      if (!mount) return;
      destroyActiveChart();
      const data = await getIntradayData();
      // Re-check mount because paint() may have rewritten innerHTML in the meantime.
      const mount2 = modalEl.querySelector('#ic-mount');
      if (!mount2) return;

      const hasBars = data && data.bars && data.bars.length && data.available !== false;
      if (!hasBars) {
        const reason = data ? data.reason : 'not_cached';
        const market = marketByDate.get(dateStr);
        const reasonMsg = ({
          'out_of_plan':  "Polygon's free tier only covers the last ~2 years. Bars beyond that aren't available.",
          'no_data':      "No intraday bars exist for this date (likely a market holiday or weekend).",
          'not_cached':   `Intraday data for this date hasn't been fetched yet. Run <code>python spy_intraday.py --date ${dateStr}</code> or use Admin → Run.`,
          'corrupt':      `Cache file exists but is corrupt. Re-fetch with <code>python spy_intraday.py --date ${dateStr}</code>.`,
          'error':        (data && data.message) || "Polygon API returned an error.",
        })[reason] || "Intraday data is not available.";
        const ohlc = market ? `<div class="ohlc">
          <span><strong>O</strong> $${(market.spy_open  || 0).toFixed(2)}</span>
          <span><strong>H</strong> $${(market.spy_high  || 0).toFixed(2)}</span>
          <span><strong>L</strong> $${(market.spy_low   || 0).toFixed(2)}</span>
          <span><strong>C</strong> $${(market.spy_close || 0).toFixed(2)}</span>
        </div>` : '';
        mount2.innerHTML = `<div class="ic-fallback">
          <span class="big">Intraday chart not available</span>
          ${reasonMsg}
          ${ohlc}
        </div>`;
        return;
      }

      const showEth  = readPref('cal-ic-eth',  true);
      const showPMHL = readPref('cal-ic-pmhl', true);
      // Filter on raw 5m bars first so aggregation boundaries don't get smeared by
      // mixing partial RTH+ETH bars when ETH is hidden.
      const sourceBars = showEth ? data.bars : data.bars.filter(b => !isExtendedHours(b.t));
      const bars = aggregateBars(sourceBars, intradayInterval);
      // Premarket H/L is always computed from the FULL data, not the filtered set —
      // otherwise hiding ETH would zero out the levels even though they exist.
      const pm = data.bars.filter(b => isPremarket(b.t));
      const pmh = pm.length ? Math.max(...pm.map(b => b.h)) : null;
      const pml = pm.length ? Math.min(...pm.map(b => b.l)) : null;
      const markers = computeTradeMarkers(dayTrades, dateStr, intradayInterval);

      mount2.innerHTML = `<div class="ic-chart-container" id="ic-chart"></div>`;
      const container = modalEl.querySelector('#ic-chart');
      if (!window.LightweightCharts) {
        mount2.innerHTML = `<div class="ic-fallback"><span class="big">Chart library failed to load</span>
          The TradingView Lightweight Charts CDN didn't respond. Check your network or reload the page.</div>`;
        return;
      }
      activeChart = LightweightCharts.createChart(container, {
        layout: { background: { color: 'transparent' }, textColor: '#888' },
        grid: {
          vertLines: { color: 'rgba(255,255,255,0.04)' },
          horzLines: { color: 'rgba(255,255,255,0.04)' },
        },
        // Force ET display (Lightweight Charts uses browser-local timezone otherwise).
        // tickMarkFormatter handles axis labels; localization.timeFormatter handles
        // the crosshair tooltip's time string.
        timeScale: {
          timeVisible: true, secondsVisible: false, borderColor: '#232633',
          tickMarkFormatter: (t) => fmtETClock(t),
        },
        localization: {
          timeFormatter: (t) => fmtETDateTime(t) + ' ET',
        },
        rightPriceScale: { borderColor: '#232633' },
        crosshair: { mode: 1 },
        autoSize: true,
      });
      const UP = '#4ade80', DOWN = '#f87171';
      // Extended-hours candles render at lower alpha so the regular session pops.
      // Matches RH's own visual treatment.
      const UP_DIM = 'rgba(74,222,128,0.32)', DOWN_DIM = 'rgba(248,113,113,0.32)';
      const series = activeChart.addCandlestickSeries({
        upColor: UP, downColor: DOWN,
        borderUpColor: UP, borderDownColor: DOWN,
        wickUpColor: UP, wickDownColor: DOWN,
      });
      series.setData(bars.map(b => {
        const item = { time: b.t, open: b.o, high: b.h, low: b.l, close: b.c };
        if (isExtendedHours(b.t)) {
          const up = b.c >= b.o;
          item.color       = up ? UP_DIM  : DOWN_DIM;
          item.borderColor = up ? UP_DIM  : DOWN_DIM;
          item.wickColor   = up ? UP_DIM  : DOWN_DIM;
        }
        return item;
      }));
      if (markers.length) series.setMarkers(markers);
      if (showPMHL && pmh != null) series.createPriceLine({ price: pmh, color: '#4ade80', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'PM High' });
      if (showPMHL && pml != null) series.createPriceLine({ price: pml, color: '#f87171', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'PM Low' });
      activeChart.timeScale().fitContent();
    }
    // Wire all the intraday-chart UI: interval (5/10/15), ETH visibility, PM H/L
    // visibility, and the persistent open/closed state of both <details> sections.
    function bindChartUI() {
      // Interval chips — set the in-modal closure var, re-mount.
      modalEl.querySelectorAll('.ic-interval-chip[data-interval]').forEach(btn => {
        btn.addEventListener('click', () => {
          intradayInterval = parseInt(btn.dataset.interval, 10);
          modalEl.querySelectorAll('.ic-interval-chip[data-interval]').forEach(b =>
            b.classList.toggle('active', b.dataset.interval === btn.dataset.interval));
          mountIntradayChart();
        });
      });
      // ETH / PM H/L toggles — flip the pref, mirror to UI, re-mount.
      modalEl.querySelectorAll('.ic-interval-chip[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.toggle === 'eth' ? 'cal-ic-eth' : 'cal-ic-pmhl';
          const next = !btn.classList.contains('active');
          btn.classList.toggle('active', next);
          writePref(key, next);
          mountIntradayChart();
        });
      });
      // Persist open/closed state of both collapsible sections.
      const ic = modalEl.querySelector('#ic-section');
      if (ic) ic.addEventListener('toggle', () => writePref('cal-ic-open', ic.open));
      const cf = modalEl.querySelector('#cf-section');
      if (cf) cf.addEventListener('toggle', () => writePref('cal-cf-open', cf.open));
    }

    // Wrap paint so each view-mode switch re-mounts the chart + re-binds chips.
    // paint is declared inside this function so reassigning it only affects this scope.
    const _origPaint = paint;
    paint = function() {
      destroyActiveChart();
      _origPaint();
      bindChartUI();
      mountIntradayChart();
    };

    paint();
    modalBg.classList.add('open');
  }

  // Wire overlay toggle chips — clicking flips the flag, persists, re-renders the month grid.
  const overlayRow = document.getElementById('cal-overlay-row');
  if (overlayRow) {
    overlayRow.querySelectorAll('.overlay-chip').forEach(btn => {
      const key = btn.dataset.overlay;
      btn.classList.toggle('active', !!overlays[key]);
      btn.addEventListener('click', () => {
        overlays[key] = !overlays[key];
        btn.classList.toggle('active', overlays[key]);
        persistOverlays();
        renderMonth();
      });
    });
    bindTips(overlayRow);
  }

  renderMonth();
})();
</script>
