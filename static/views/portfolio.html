<style>
.kpi.clickable { cursor: pointer; transition: background .15s, transform .1s; position: relative; }
.kpi.clickable:hover { background: #20242f; }
.kpi.clickable::after {
  content: "ⓘ"; position: absolute; top: 8px; right: 10px;
  font-size: 11px; color: #555;
}
/* Modal styling is shared — see .info-modal-* in style.css */
.pf-data-note {
  font-size: 11px; color: #666; text-align: center;
  margin-top: 8px;
}
.pf-pending-pill {
  display: inline-flex; align-items: center; gap: 4px;
  margin-left: 10px; padding: 2px 10px; border-radius: 999px;
  background: #2a2410; border: 1px solid #4a3a14; color: #fbbf24;
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: background .12s;
}
.pf-pending-pill:hover { background: #382e14; }
.pos { color: #4ade80; }
.neg { color: #f87171; }

.pf-span-row {
  display: flex; gap: 6px; margin: 4px 0 18px;
  flex-wrap: wrap; align-items: center;
}
.pf-span-row .pf-span-label {
  font-size: 11px; color: #666; text-transform: uppercase;
  letter-spacing: 0.8px; margin-right: 6px;
}
.pf-span {
  padding: 6px 14px; border-radius: 8px; font-size: 12px;
  cursor: pointer; background: transparent; color: #888;
  border: 1px solid transparent; transition: all 0.12s;
  font-weight: 600; letter-spacing: 0.4px;
}
.pf-span:hover { color: #ccc; background: #1a1d27; }
.pf-span.active {
  background: #262938; color: #fff; border-color: #3a3d4a;
}
.pf-span.disabled { opacity: 0.35; cursor: not-allowed; }
</style>

<h1>Portfolio</h1>
<p class="subtitle" id="portfolio-sub">Loading...</p>

<div class="kpi-row" id="portfolio-kpis"></div>

<div class="pf-span-row" id="portfolio-span-row" style="display:none">
  <span class="pf-span-label">Range</span>
  <button class="pf-span" data-span="1D">1D</button>
  <button class="pf-span" data-span="1W">1W</button>
  <button class="pf-span" data-span="1M">1M</button>
  <button class="pf-span" data-span="3M">3M</button>
  <button class="pf-span" data-span="6M">6M</button>
  <button class="pf-span" data-span="YTD">YTD</button>
  <button class="pf-span" data-span="1Y">1Y</button>
  <button class="pf-span" data-span="5Y">5Y</button>
  <button class="pf-span" data-span="ALL">ALL</button>
</div>

<div class="grid" id="portfolio-charts"></div>
<div class="pf-data-note" id="portfolio-data-note"></div>

<div class="info-modal-bg" id="pf-modal-bg">
  <div class="info-modal-wrap">
    <div class="info-modal" id="pf-modal"></div>
  </div>
</div>

<script>
(async function() {
  Chart.defaults.color = '#999';
  Chart.defaults.borderColor = '#2a2d3a';
  Chart.defaults.font.family = "'Inter',sans-serif";
  Chart.defaults.interaction.mode = 'index';
  Chart.defaults.interaction.intersect = false;

  const g = '#4ade80', r = '#f87171', b = '#60a5fa', y = '#fbbf24', gray = '#888';
  const charts = [];

  const fmt$ = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
  const fmt$2 = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const fmtPct = (n) => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
  const signCls = (n) => n >= 0 ? 'pos' : 'neg';

  let snapshots;
  try {
    snapshots = await apiFetch('/api/cash-flow');
  } catch (e) {
    document.getElementById('portfolio-sub').textContent = 'Failed to load: ' + e.message;
    return;
  }

  if (!snapshots || !snapshots.length) {
    document.getElementById('portfolio-sub').textContent = 'No cash flow snapshots yet — run cash_flow.py.';
    return;
  }

  const byDay = new Map();
  for (const s of snapshots) {
    const d = (s.timestamp || '').slice(0, 10);
    if (d) byDay.set(d, s);
  }
  const daily = [...byDay.values()];
  const latest = snapshots[snapshots.length - 1];
  const earliest = snapshots[0];

  // Pending transfers — recompute basis-dependent KPIs on the fly so the
  // dashboard reflects pending immediately, before the next cash_flow.py run
  // bakes them into the persisted snapshot. RH already moves equity when an
  // ACH is initiated, so excluding pending from basis distorts P/L.
  const depPending = latest.deposits_pending || 0;
  const wdPending = latest.withdrawals_pending || 0;
  const hasPending = depPending > 0 || wdPending > 0;

  if (hasPending) {
    const depTot = (latest.deposits || 0) + depPending;
    const wdTot = (latest.withdrawals || 0) + wdPending;
    const netDep = depTot - wdTot;
    const basis = netDep - (latest.gold_fees || 0) + (latest.dividends || 0) + (latest.referral_grants || 0);
    const equity = latest.current_equity || 0;
    latest.net_deposited = +netDep.toFixed(2);
    latest.net_cash_basis = +basis.toFixed(2);
    latest.all_time_pnl = +(equity - basis).toFixed(2);
    latest.all_time_pnl_pct = depTot ? +((equity - basis) / depTot * 100).toFixed(1) : 0;
    latest.total_return = +(equity + wdTot - depTot).toFixed(2);
    latest.total_return_pct = depTot ? +((equity + wdTot - depTot) / depTot * 100).toFixed(1) : 0;
  }

  const subEl = document.getElementById('portfolio-sub');
  subEl.textContent =
    `${daily.length} daily snapshot${daily.length === 1 ? '' : 's'} · latest ${latest.timestamp.slice(0, 10)}`;
  if (hasPending) {
    const pill = document.createElement('span');
    pill.className = 'pf-pending-pill';
    pill.textContent = `⏳ ${fmt$(depPending - wdPending >= 0 ? depPending - wdPending : -(depPending - wdPending))} pending`;
    pill.title = 'Pending transfers — click for details';
    pill.addEventListener('click', detailPending);
    subEl.appendChild(pill);
  }

  document.getElementById('portfolio-data-note').textContent =
    `Snapshot history: ${earliest.timestamp.slice(0, 10)} → ${latest.timestamp.slice(0, 10)}. ` +
    `Earlier dates aren't available — cash_flow.py only records snapshots on each run.`;

  // ── Modal helpers ──
  const modalBg = document.getElementById('pf-modal-bg');
  const modal = document.getElementById('pf-modal');

  function openModal(html) {
    // Builders pass a leading <h2>Title</h2>; lift it into the flex header (M3),
    // everything else scrolls in the body. Keeps the close button anchored to the card.
    const m = html.match(/<h2>([\s\S]*?)<\/h2>/);
    const title = m ? m[1] : '';
    const body = html.replace(/<h2>[\s\S]*?<\/h2>/, '');
    modal.innerHTML =
      `<div class="info-head"><h2>${title}</h2><button class="info-close" aria-label="Close">×</button></div>` +
      `<div class="info-body">${body}</div>`;
    modalBg.classList.add('open');
    modal.querySelector('.info-close').addEventListener('click', closeModal);
  }
  function closeModal() { modalBg.classList.remove('open'); }
  modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') closeModal();
  });

  function row(label, value, opts = {}) {
    const cls = opts.cls || '';
    const valCls = opts.color ? ` style="color:${opts.color}"` : '';
    return `<div class="info-row ${opts.total ? 'total' : ''}">
      <span class="info-lbl">${label}</span>
      <span class="info-val ${cls}"${valCls}>${value}</span>
    </div>`;
  }

  // ── Detail builders ──
  function detailEquity() {
    const accts = latest.accounts || [];
    const total = latest.current_equity || 0;
    const rows = accts.length
      ? accts.map(a => {
          const positions = (a.equity || 0) - (a.cash || 0);
          return row(
            `${a.type} <span style="color:#666;font-size:11px">(${a.account_number})</span>`,
            fmt$2(a.equity)
          ) + row(
            `<span style="color:#777;font-size:12px;margin-left:14px">↳ cash</span>`,
            fmt$2(a.cash)
          ) + row(
            `<span style="color:#777;font-size:12px;margin-left:14px">↳ positions</span>`,
            fmt$2(positions)
          );
        }).join('')
      : `<div class="info-row"><span class="info-lbl" style="color:#888">Per-account breakdown not in this snapshot. Re-run <code>cash_flow.py</code> to populate.</span></div>`;
    openModal(`
      <h2>Current Equity</h2>
      <div class="info-sub">Total portfolio value across all accounts</div>
      ${rows}
      ${accts.length ? row('Total equity', fmt$2(total), {total: true}) : ''}
    `);
  }

  function detailAllTimePL() {
    const equity = latest.current_equity || 0;
    const basis = latest.net_cash_basis || 0;
    const pnl = latest.all_time_pnl || 0;
    const pct = latest.all_time_pnl_pct || 0;
    const depTot = (latest.deposits || 0) + (latest.deposits_pending || 0);
    openModal(`
      <h2>All-time P/L</h2>
      <div class="info-sub">Equity above what was invested net of income</div>
      <div class="info-formula">all_time_pnl = current_equity − net_cash_basis</div>
      ${row('Current equity', fmt$2(equity))}
      ${row('Net cash basis', `−${fmt$2(basis)}`)}
      ${row('= All-time P/L', `<span class="${signCls(pnl)}">${fmt$2(pnl)} (${fmtPct(pct)})</span>`, {total: true})}
      <div class="info-formula">net_cash_basis = net_deposited − gold_fees + dividends + referral_grants</div>
      ${row('Net deposited' + (hasPending ? ' <span style="color:#fbbf24;font-size:11px">(incl. pending)</span>' : ''), fmt$2(latest.net_deposited || 0))}
      ${row('Gold fees', `−${fmt$2(latest.gold_fees || 0)}`)}
      ${row('Dividends', `+${fmt$2(latest.dividends || 0)}`)}
      ${row('Referral grants', `+${fmt$2(latest.referral_grants || 0)}`)}
      ${row('= Net cash basis', fmt$2(basis), {total: true})}
      <div class="info-sub" style="margin-top:14px">Percentage is on total deposits including pending (${fmt$2(depTot)}).</div>
    `);
  }

  function detailTotalReturn() {
    const equity = latest.current_equity || 0;
    const dep = latest.deposits || 0;
    const wd = latest.withdrawals || 0;
    const depP = latest.deposits_pending || 0;
    const wdP = latest.withdrawals_pending || 0;
    const depTot = dep + depP;
    const wdTot = wd + wdP;
    const tr = latest.total_return || 0;
    const trPct = latest.total_return_pct || 0;
    openModal(`
      <h2>Total Return</h2>
      <div class="info-sub">If you cashed out today, this is your lifetime gain/loss net of every dollar moved in or out</div>
      <div class="info-formula">total_return = current_equity + withdrawals − deposits</div>
      ${row('Current equity', fmt$2(equity))}
      ${row('Withdrawals (taken out)' + (wdP ? ' <span style="color:#fbbf24;font-size:11px">(incl. pending)</span>' : ''), `+${fmt$2(wdTot)}`)}
      ${row('Deposits (put in)' + (depP ? ' <span style="color:#fbbf24;font-size:11px">(incl. pending)</span>' : ''), `−${fmt$2(depTot)}`)}
      ${row('= Total return', `<span class="${signCls(tr)}">${fmt$2(tr)} (${fmtPct(trPct)})</span>`, {total: true})}
      <div class="info-sub" style="margin-top:14px">
        Pending transfers are included — RH already moves equity when an ACH is initiated.
        Includes fees, dividends, and referrals implicitly (they're already reflected in current equity).
        Differs from <em>All-time P/L</em>, which compares equity to a deposit-adjusted cost basis instead.
      </div>
    `);
  }

  function detailNetDeposited() {
    const dep = latest.deposits || 0;
    const wd = latest.withdrawals || 0;
    const depP = latest.deposits_pending || 0;
    const wdP = latest.withdrawals_pending || 0;
    const net = latest.net_deposited || 0;
    openModal(`
      <h2>Net Deposited</h2>
      <div class="info-sub">All ACH transfers in/out, including pending</div>
      <div class="info-formula">net_deposited = (deposits + pending) − (withdrawals + pending)</div>
      ${row('Completed deposits', `+${fmt$2(dep)}`, {color: g})}
      ${depP ? row('Pending deposits', `+${fmt$2(depP)}`, {color: y}) : ''}
      ${row('Completed withdrawals', `−${fmt$2(wd)}`, {color: r})}
      ${wdP ? row('Pending withdrawals', `−${fmt$2(wdP)}`, {color: y}) : ''}
      ${row('= Net deposited', fmt$2(net), {total: true})}
      <div class="info-sub" style="margin-top:14px">
        ${(depP || wdP)
          ? 'Pending transfers are folded in because RH already debits/credits equity at initiation. They\'ll move to "completed" within a few days.'
          : 'No pending transfers.'}
      </div>
    `);
  }

  function detailPending() {
    const depP = latest.deposits_pending || 0;
    const wdP = latest.withdrawals_pending || 0;
    const net = depP - wdP;
    openModal(`
      <h2>Pending Transfers</h2>
      <div class="info-sub">In-flight ACH activity — included in basis, will settle within a few days</div>
      ${row('Pending deposits', `+${fmt$2(depP)}`, {color: g})}
      ${row('Pending withdrawals', `−${fmt$2(wdP)}`, {color: r})}
      ${row('= Net pending', `<span class="${signCls(net)}">${fmt$2(net)}</span>`, {total: true})}
      <div class="info-sub" style="margin-top:14px">
        These are folded into Net Deposited / All-time P/L / Total Return because Robinhood already
        moves equity when a transfer is initiated. On the next <code>cash_flow.py</code> run they'll
        flip from "pending" to "completed" with no change to your P/L numbers.
      </div>
    `);
  }

  function detailLifetimeIncome() {
    const div = latest.dividends || 0;
    const ref = latest.referral_grants || 0;
    const fees = latest.gold_fees || 0;
    const months = latest.gold_months;
    const total = div + ref - fees;
    openModal(`
      <h2>Lifetime Income</h2>
      <div class="info-sub">Money RH has paid you (or charged), separate from market gains</div>
      <div class="info-formula">lifetime_income = dividends + referral_grants − gold_fees</div>
      ${row('Dividends', `+${fmt$2(div)}`, {color: g})}
      ${row('Referral grants', `+${fmt$2(ref)}`, {color: g})}
      ${row(`Gold subscription fees${months ? ` <span style="color:#666;font-size:11px">(${months} months)</span>` : ''}`, `−${fmt$2(fees)}`, {color: r})}
      ${row('= Lifetime income', `<span class="${signCls(total)}">${fmt$2(total)}</span>`, {total: true})}
    `);
  }

  // ── Render KPIs ──
  const lifetimeIncome = (latest.dividends || 0) + (latest.referral_grants || 0) - (latest.gold_fees || 0);
  const pnlColor = (latest.all_time_pnl || 0) >= 0 ? g : r;
  const trColor = (latest.total_return || 0) >= 0 ? g : r;
  const incomeColor = lifetimeIncome >= 0 ? g : r;

  const kpiRow = document.getElementById('portfolio-kpis');
  kpiRow.innerHTML = `
    <div class="kpi clickable" data-kpi="equity">
      <div class="kpi-label">Current Equity</div>
      <div class="kpi-val">${fmt$2(latest.current_equity || 0)}</div>
    </div>
    <div class="kpi clickable" data-kpi="pnl">
      <div class="kpi-label">All-time P/L</div>
      <div class="kpi-val" style="color:${pnlColor}">${fmt$2(latest.all_time_pnl || 0)}</div>
      <div class="kpi-label" style="margin-top:4px;color:${pnlColor}">${fmtPct(latest.all_time_pnl_pct || 0)}</div>
    </div>
    <div class="kpi clickable" data-kpi="tr">
      <div class="kpi-label">Total Return</div>
      <div class="kpi-val" style="color:${trColor}">${fmt$2(latest.total_return || 0)}</div>
      <div class="kpi-label" style="margin-top:4px;color:${trColor}">${fmtPct(latest.total_return_pct || 0)}</div>
    </div>
    <div class="kpi clickable" data-kpi="netdep">
      <div class="kpi-label">Net Deposited</div>
      <div class="kpi-val">${fmt$2(latest.net_deposited || 0)}</div>
      <div class="kpi-label" style="margin-top:4px">${fmt$(latest.deposits || 0)} in · ${fmt$(latest.withdrawals || 0)} out</div>
    </div>
    <div class="kpi clickable" data-kpi="income">
      <div class="kpi-label">Lifetime Income</div>
      <div class="kpi-val" style="color:${incomeColor}">${fmt$2(lifetimeIncome)}</div>
      <div class="kpi-label" style="margin-top:4px">div ${fmt$(latest.dividends || 0)} · ref ${fmt$(latest.referral_grants || 0)} · fees -${fmt$(latest.gold_fees || 0)}</div>
    </div>
  `;

  const handlers = { equity: detailEquity, pnl: detailAllTimePL, tr: detailTotalReturn, netdep: detailNetDeposited, income: detailLifetimeIncome };
  kpiRow.querySelectorAll('.kpi.clickable').forEach(el => {
    el.addEventListener('click', () => {
      const fn = handlers[el.dataset.kpi];
      if (fn) fn();
    });
  });

  // ── Charts ──
  const grid = document.getElementById('portfolio-charts');
  if (daily.length < 2) {
    grid.innerHTML = '<div class="card full"><p class="subtitle" style="margin:0">Need at least 2 daily snapshots to render charts. Re-run cash_flow.py tomorrow.</p></div>';
    return;
  }

  // The three full-width charts are different lenses on the same time axis —
  // collapsed into one tabbed card following the equity-tabs paradigm in analysis.html.
  grid.innerHTML = `
    <div class="card full">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 id="pf-main-title" style="margin-bottom:0">Equity vs Cost Basis</h2>
        <div class="tabs" style="margin-bottom:0" id="pf-main-tabs">
          <div class="tab active" data-mode="eq-basis">Equity vs Basis</div>
          <div class="tab" data-mode="pnl-time">All-time P/L</div>
          <div class="tab" data-mode="period-return">Period Return</div>
        </div>
      </div>
      <canvas id="pf-main"></canvas>
    </div>
    <div class="card"><h2>Cumulative Deposits & Withdrawals</h2><canvas id="dep-wd"></canvas></div>
  `;
  const MAIN_TITLES = {
    'eq-basis': 'Equity vs Cost Basis',
    'pnl-time': 'All-time P/L',
    'period-return': 'Period Return',
  };
  const MAIN_TAB_KEY = 'pf-main-tab';
  let mainMode = localStorage.getItem(MAIN_TAB_KEY) || 'eq-basis';
  if (!(mainMode in MAIN_TITLES)) mainMode = 'eq-basis';

  // ── Span filtering ──
  const SPANS = {
    '1D': 1, '1W': 7, '1M': 30, '3M': 91, '6M': 183,
    'YTD': 'ytd', '1Y': 365, '5Y': 1825, 'ALL': null,
  };
  const SPAN_LABEL = {
    '1D': 'Past day', '1W': 'Past week',
    '1M': 'Past month', '3M': 'Past 3 months', '6M': 'Past 6 months',
    'YTD': 'Year to date', '1Y': 'Past year', '5Y': 'Past 5 years', 'ALL': 'All time',
  };

  // Earliest data date — used to disable spans that would be empty
  const earliestDateStr = earliest.timestamp.slice(0, 10);
  const earliestDate = new Date(earliestDateStr + 'T00:00:00');
  const daysOfData = Math.floor((Date.now() - earliestDate.getTime()) / 86400000);

  function filterDaily(span) {
    if (span === 'ALL' || span === null) return daily;
    // Special case 1D: use raw (pre-dedup) snapshots so multi-snapshot days
    // (manual + cron runs on the same day) show intra-day variation.
    if (span === '1D') {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todays = snapshots.filter(s => (s.timestamp || '').slice(0, 10) === todayStr);
      if (todays.length >= 2) return todays;
      // Fall back to last 2 daily points so the chart at least renders.
      return daily.slice(-2);
    }
    let cutoffStr;
    if (span === 'YTD' || SPANS[span] === 'ytd') {
      cutoffStr = new Date(new Date().getFullYear(), 0, 1).toISOString().slice(0, 10);
    } else {
      cutoffStr = new Date(Date.now() - SPANS[span] * 86400000).toISOString().slice(0, 10);
    }
    const sliced = daily.filter(s => s.timestamp.slice(0, 10) >= cutoffStr);
    // Always include at least 2 points so charts render — fall back to last 2
    return sliced.length >= 2 ? sliced : daily.slice(-2);
  }

  const STORAGE_KEY = 'pf-active-span';
  let activeSpan = localStorage.getItem(STORAGE_KEY) || '1Y';
  if (!(activeSpan in SPANS)) activeSpan = '1Y';
  // With the synthetic backfill removed, the data range is small (live-snapshots only).
  // If the persisted choice would have no data, fall back to ALL.
  const reqDays = SPANS[activeSpan];
  if (typeof reqDays === 'number' && reqDays > daysOfData + 1) activeSpan = 'ALL';

  // Show + wire up the span row
  const spanRow = document.getElementById('portfolio-span-row');
  spanRow.style.display = '';
  spanRow.querySelectorAll('.pf-span').forEach(btn => {
    const sp = btn.dataset.span;
    // Disable spans that would have no data
    const required = SPANS[sp];
    if (typeof required === 'number' && required > daysOfData + 1 && sp !== 'ALL') {
      btn.classList.add('disabled');
    }
    btn.addEventListener('click', () => {
      if (btn.classList.contains('disabled')) return;
      if (sp === activeSpan) return;
      activeSpan = sp;
      localStorage.setItem(STORAGE_KEY, sp);
      updateActiveSpan();
      renderCharts();
    });
  });
  function updateActiveSpan() {
    spanRow.querySelectorAll('.pf-span').forEach(b => {
      b.classList.toggle('active', b.dataset.span === activeSpan);
    });
  }
  updateActiveSpan();

  // ── Tooltip + axis helpers ──
  const dateFmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const dollarTicks = {
    ticks: { callback: (v) => fmt$(v) },
    grid: { borderDash: [3, 4], color: '#222530' },
  };
  const xTimeScale = (sliced) => {
    // Choose tick unit by span breadth
    const days = sliced.length
      ? (new Date(sliced[sliced.length - 1].timestamp) - new Date(sliced[0].timestamp)) / 86400000
      : 0;
    let unit, tooltipFormat;
    if (days <= 1) { unit = 'hour'; tooltipFormat = 'MMM d, h:mm a'; }
    else if (days <= 14) { unit = 'day'; tooltipFormat = 'MMM d, yyyy'; }
    else if (days <= 60) { unit = 'week'; tooltipFormat = 'MMM d, yyyy'; }
    else if (days <= 730) { unit = 'month'; tooltipFormat = 'MMM d, yyyy'; }
    else { unit = 'year'; tooltipFormat = 'MMM d, yyyy'; }
    return {
      type: 'time',
      time: { unit, tooltipFormat, displayFormats: {
        hour: 'h:mm a', day: 'MMM d', week: 'MMM d',
        month: 'MMM yyyy', year: 'yyyy',
      } },
      grid: { display: false },
      ticks: { maxRotation: 0, autoSkip: true, autoSkipPadding: 16 },
    };
  };
  // Title is auto-formatted by Chart.js using time.tooltipFormat from the scale config.
  const tooltipMoney = {
    callbacks: {
      label: (ctx) => `${ctx.dataset.label}: ${fmt$2(ctx.parsed.y)}`,
    },
  };
  const subtitlePlugin = (text) => ({
    display: true, text, color: '#666', font: { size: 11, weight: 'normal' },
    padding: { top: 0, bottom: 8 }, align: 'start',
  });

  // Gradient fill helper — needs the chart context
  function makeGradient(ctx, hex, area) {
    const grad = ctx.createLinearGradient(0, area.top, 0, area.bottom);
    grad.addColorStop(0, hex + '55');
    grad.addColorStop(1, hex + '00');
    return grad;
  }

  // ── Chart rendering ──
  // The main canvas (#pf-main) is recycled across the three lens tabs; dep-wd is its own card.
  let mainChart = null;

  function buildMainConfig(mode, sliced, dense, subtitle) {
    if (mode === 'eq-basis') {
      const eqXY = sliced.map(s => ({ x: s.timestamp, y: s.current_equity || 0 }));
      const basisXY = sliced.map(s => ({ x: s.timestamp, y: s.net_cash_basis || 0 }));
      return {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Equity', data: eqXY,
              borderColor: b, borderWidth: 2,
              backgroundColor: (ctx) => {
                const { chart } = ctx;
                if (!chart.chartArea) return b + '22';
                return makeGradient(chart.ctx, b, chart.chartArea);
              },
              fill: 'origin',
              cubicInterpolationMode: 'monotone',
              tension: 0.2,
              pointRadius: dense ? 0 : 3,
              pointHoverRadius: 5,
            },
            {
              label: 'Cost Basis', data: basisXY,
              borderColor: gray, borderWidth: 1.5, borderDash: [5, 4],
              fill: false,
              cubicInterpolationMode: 'monotone',
              tension: 0.2,
              pointRadius: 0,
              pointHoverRadius: 4,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { tooltip: tooltipMoney, subtitle: subtitlePlugin(subtitle) },
          scales: { x: xTimeScale(sliced), y: dollarTicks },
        },
      };
    }
    if (mode === 'pnl-time') {
      const pnlXY = sliced.map(s => ({ x: s.timestamp, y: s.all_time_pnl || 0 }));
      return {
        type: 'line',
        data: {
          datasets: [{
            label: 'All-time P/L', data: pnlXY,
            borderColor: '#9ca3af', borderWidth: 1.5,
            fill: { target: 'origin', above: g + '22', below: r + '22' },
            cubicInterpolationMode: 'monotone',
            tension: 0.2,
            pointRadius: dense ? 0 : 2,
            pointHoverRadius: 5,
          }],
        },
        options: {
          responsive: true,
          plugins: { tooltip: tooltipMoney, subtitle: subtitlePlugin(subtitle) },
          scales: { x: xTimeScale(sliced), y: dollarTicks },
        },
      };
    }
    // period-return
    const baseEquity = sliced[0].current_equity || 1;
    const periodReturnXY = sliced.map(s => ({
      x: s.timestamp,
      y: baseEquity ? ((s.current_equity || 0) / baseEquity - 1) * 100 : 0,
    }));
    return {
      type: 'line',
      data: {
        datasets: [{
          label: 'Return',
          data: periodReturnXY,
          borderColor: '#9ca3af', borderWidth: 1.5,
          fill: { target: 'origin', above: g + '22', below: r + '22' },
          cubicInterpolationMode: 'monotone',
          tension: 0.2,
          pointRadius: dense ? 0 : 2,
          pointHoverRadius: 5,
        }],
      },
      options: {
        responsive: true,
        plugins: {
          subtitle: subtitlePlugin(`Equity normalized to 0% at start of ${SPAN_LABEL[activeSpan].toLowerCase()}`),
          tooltip: { callbacks: { label: (ctx) => `Return: ${fmtPct(ctx.parsed.y)}` } },
        },
        scales: {
          x: xTimeScale(sliced),
          y: { ticks: { callback: (v) => fmtPct(v) }, grid: { borderDash: [3, 4], color: '#222530' } },
        },
      },
    };
  }

  function renderMain(sliced, dense, subtitle) {
    if (mainChart) {
      const i = charts.indexOf(mainChart);
      if (i >= 0) charts.splice(i, 1);
      mainChart.destroy();
      mainChart = null;
    }
    document.getElementById('pf-main-title').textContent = MAIN_TITLES[mainMode];
    document.querySelectorAll('#pf-main-tabs .tab').forEach(t =>
      t.classList.toggle('active', t.dataset.mode === mainMode));
    mainChart = new Chart(document.getElementById('pf-main'), buildMainConfig(mainMode, sliced, dense, subtitle));
    charts.push(mainChart);
  }

  function renderCharts() {
    // Clean up previous chart instances
    while (charts.length) charts.pop().destroy();
    mainChart = null;

    const sliced = filterDaily(activeSpan);
    const points = sliced.length;
    const dense = points >= 90;
    const subtitle = SPAN_LABEL[activeSpan] + ` · ${points} day${points === 1 ? '' : 's'}`;

    renderMain(sliced, dense, subtitle);

    const depXY = sliced.map(s => ({ x: s.timestamp, y: s.deposits || 0 }));
    const wdXY = sliced.map(s => ({ x: s.timestamp, y: s.withdrawals || 0 }));

    // Deposits vs Withdrawals — gradients
    charts.push(new Chart(document.getElementById('dep-wd'), {
      type: 'line',
      data: {
        datasets: [
          {
            label: 'Deposits', data: depXY,
            borderColor: g, borderWidth: 2,
            backgroundColor: (ctx) => {
              const { chart } = ctx;
              if (!chart.chartArea) return g + '22';
              return makeGradient(chart.ctx, g, chart.chartArea);
            },
            fill: 'origin',
            cubicInterpolationMode: 'monotone',
            tension: 0.2,
            pointRadius: 0,
            pointHoverRadius: 4,
          },
          {
            label: 'Withdrawals', data: wdXY,
            borderColor: r, borderWidth: 2,
            backgroundColor: (ctx) => {
              const { chart } = ctx;
              if (!chart.chartArea) return r + '22';
              return makeGradient(chart.ctx, r, chart.chartArea);
            },
            fill: 'origin',
            cubicInterpolationMode: 'monotone',
            tension: 0.2,
            pointRadius: 0,
            pointHoverRadius: 4,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { tooltip: tooltipMoney, subtitle: subtitlePlugin(subtitle) },
        scales: { x: xTimeScale(sliced), y: dollarTicks },
      },
    }));
  }

  // Tab clicks rebuild only the main canvas (dep-wd is unaffected).
  document.querySelectorAll('#pf-main-tabs .tab').forEach(t => {
    t.addEventListener('click', () => {
      if (t.dataset.mode === mainMode) return;
      mainMode = t.dataset.mode;
      localStorage.setItem(MAIN_TAB_KEY, mainMode);
      const sliced = filterDaily(activeSpan);
      const points = sliced.length;
      const dense = points >= 90;
      const subtitle = SPAN_LABEL[activeSpan] + ` · ${points} day${points === 1 ? '' : 's'}`;
      renderMain(sliced, dense, subtitle);
    });
  });

  renderCharts();
})();
</script>
